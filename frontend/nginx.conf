server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte a SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para a API REST e SSE do backend-publisher
    location /api/ {
        proxy_pass http://backend-publisher:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Configurações essenciais para Server-Sent Events (SSE) sem buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }
}

